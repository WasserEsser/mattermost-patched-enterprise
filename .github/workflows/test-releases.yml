name: Test new Mattermost releases

on:
  schedule:
    # Check daily at 2am UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      mattermost_tag:
        description: 'Specific Mattermost image tag to test (e.g. 11.8.2)'
        required: false
        default: ''
  # Test that PRs do not break any supported version: runs the patch and
  # license verification against a representative version per pattern group.
  pull_request:

# Cancel superseded runs of the same kind (newer PR push, newer nightly)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'nightly' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      # Needed to execute the ARM64 binary (binfmt via qemu-user) on the
      # x86-64 runner for the smoke test
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install patch tooling
        run: |
          if ! command -v xxd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq vim-common
          fi

      - name: Discover new Mattermost releases
        id: discover
        # Uses the GitHub Releases API (authenticated via GITHUB_TOKEN) instead
        # of the Docker Hub web API, which is shared across all GitHub Actions
        # runners and frequently returns 429s during nightly runs.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # If a specific tag was provided manually, use only that
          if [ -n "${{ inputs.mattermost_tag }}" ]; then
            echo "new_tags=${{ inputs.mattermost_tag }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch stable releases from GitHub API. This is authenticated via
          # GITHUB_TOKEN so it gets 5,000 req/hr, never rate limited from
          # within GitHub Actions.
          ALL_TAGS=$(curl -sf \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mattermost/mattermost/releases?per_page=50" \
            | python3 -c "
          import sys, json
          releases = json.load(sys.stdin)
          tags = []
          for r in releases:
              # Skip prereleases and drafts
              if r.get('prerelease') or r.get('draft'):
                  continue
              tag = r['tag_name'].lstrip('v')
              # Stable semver only: X.Y.Z with all numeric parts
              parts = tag.split('.')
              if len(parts) == 3 and all(p.isdigit() for p in parts):
                  tags.append(tag)
          # Only report the latest release per minor version to keep the
          # test matrix manageable. Older patch releases still work because
          # patch.sh auto-detects the version.
          latest_by_minor = {}
          for t in sorted(tags, key=lambda s: [int(x) for x in s.split('.')]):
              major, minor, _ = t.split('.')
              latest_by_minor[f'{major}.{minor}'] = t
          print('\n'.join(sorted(latest_by_minor.values())))
          ")

          # new_tags can span multiple lines, which GITHUB_OUTPUT only accepts
          # via the heredoc-style delimiter syntax.
          DELIMITER="mm_eof"
          echo "new_tags<<${DELIMITER}" >> "$GITHUB_OUTPUT"
          echo "$ALL_TAGS" >> "$GITHUB_OUTPUT"
          echo "${DELIMITER}" >> "$GITHUB_OUTPUT"
          echo "Discovered releases to test: ${ALL_TAGS:-none}"

      - name: Test patch against new releases
        if: steps.discover.outputs.new_tags != ''
        id: build
        run: |
          set -uo pipefail

          mapfile -t TAGS <<< "${{ steps.discover.outputs.new_tags }}"

          SUCCEEDED=""
          FAILED=""
          SKIPPED=""
          ARM64_SUCCEEDED=""
          ARM64_FAILED=""
          ARM64_SKIPPED=""
          LICENSE_FAILED=""
          PORT=18000

          for TAG in "${TAGS[@]}"; do
            [ -z "$TAG" ] && continue
            echo "=== Testing Mattermost ${TAG} ==="

            # Verify the image tag exists on Docker Hub before attempting build.
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://hub.docker.com/v2/repositories/mattermost/mattermost-enterprise-edition/tags/${TAG}")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "Tag ${TAG} does not exist on Docker Hub yet (HTTP ${HTTP_CODE}), skipping"
              SKIPPED="${SKIPPED}${SKIPPED:+, }${TAG}"
              ARM64_SKIPPED="${ARM64_SKIPPED}${ARM64_SKIPPED:+, }${TAG}"
              continue
            fi

            # x86-64 build (classic builder, from the Docker Hub image)
            if docker build --build-arg MATTERMOST_IMAGE_TAG="${TAG}" -t mm-test:"${TAG}" . ; then
              SUCCEEDED="${SUCCEEDED}${SUCCEEDED:+, }${TAG}"
              echo "Patched ${TAG} (amd64) successfully"
              # Extract the patched binary plus i18n/templates/mmctl from the
              # image and verify the license is accepted end-to-end.
              rm -rf "/tmp/mm-amd64-${TAG}" && mkdir -p "/tmp/mm-amd64-${TAG}/bin"
              CID=$(docker create mm-test:"${TAG}")
              docker cp "${CID}:/mattermost/bin/mattermost" "/tmp/mm-amd64-${TAG}/bin/"
              docker cp "${CID}:/mattermost/bin/mmctl" "/tmp/mm-amd64-${TAG}/bin/"
              docker cp "${CID}:/mattermost/i18n" "/tmp/mm-amd64-${TAG}/"
              docker cp "${CID}:/mattermost/templates" "/tmp/mm-amd64-${TAG}/"
              docker cp "${CID}:/mattermost/config" "/tmp/mm-amd64-${TAG}/"
              docker rm "${CID}" >/dev/null
              if bash .github/license-check.sh "/tmp/mm-amd64-${TAG}" "${TAG}-amd64" "$PORT"; then
                echo "License OK for ${TAG} (amd64)"
              else
                LICENSE_FAILED="${LICENSE_FAILED}${LICENSE_FAILED:+, }${TAG} (amd64)"
              fi
              PORT=$((PORT + 1))
            else
              FAILED="${FAILED}${FAILED:+, }${TAG}"
              echo "Build failed for ${TAG} (amd64)"
            fi

            # Mattermost does not publish ARM64 images on Docker Hub, only
            # arm64 tarballs on releases.mattermost.com (starting with 6.1).
            # Download, extract and patch the binary directly, then
            # smoke-test it under QEMU.
            ARM64_TARBALL_URL="https://releases.mattermost.com/${TAG}/mattermost-enterprise-${TAG}-linux-arm64.tar.gz"
            if curl -sfIL -o /dev/null "$ARM64_TARBALL_URL"; then
              rm -rf /tmp/mm-arm64 && mkdir -p /tmp/mm-arm64
              if curl -sfL "$ARM64_TARBALL_URL" | tar -xz -C /tmp/mm-arm64; then
                ARM64_BIN="/tmp/mm-arm64/mattermost/bin/mattermost"
                if [ -f "$ARM64_BIN" ]; then
                  if bash patch.sh --quiet "$ARM64_BIN"; then
                    if "$ARM64_BIN" version > /tmp/mm-arm64/version.txt 2>&1; then
                      ARM64_SUCCEEDED="${ARM64_SUCCEEDED}${ARM64_SUCCEEDED:+, }${TAG}"
                      echo "Patched ${TAG} (arm64) successfully"
                      head -3 /tmp/mm-arm64/version.txt
                      if bash .github/license-check.sh /tmp/mm-arm64/mattermost "${TAG}-arm64" "$PORT"; then
                        echo "License OK for ${TAG} (arm64)"
                      else
                        LICENSE_FAILED="${LICENSE_FAILED}${LICENSE_FAILED:+, }${TAG} (arm64)"
                      fi
                      PORT=$((PORT + 1))
                    else
                      ARM64_FAILED="${ARM64_FAILED}${ARM64_FAILED:+, }${TAG}"
                      echo "ARM64 smoke test failed for ${TAG}"
                      head -5 /tmp/mm-arm64/version.txt
                    fi
                  else
                    ARM64_FAILED="${ARM64_FAILED}${ARM64_FAILED:+, }${TAG}"
                    echo "Patch failed for ${TAG} (arm64)"
                  fi
                else
                  ARM64_FAILED="${ARM64_FAILED}${ARM64_FAILED:+, }${TAG}"
                  echo "Unexpected tarball layout for ${TAG} (arm64)"
                fi
              else
                ARM64_FAILED="${ARM64_FAILED}${ARM64_FAILED:+, }${TAG}"
                echo "Download failed for ${TAG} (arm64)"
              fi
            else
              echo "Tag ${TAG} has no ARM64 tarball on releases.mattermost.com, skipping arm64"
              ARM64_SKIPPED="${ARM64_SKIPPED}${ARM64_SKIPPED:+, }${TAG}"
            fi
          done

          echo "succeeded=${SUCCEEDED}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          echo "skipped=${SKIPPED}" >> "$GITHUB_OUTPUT"
          echo "arm64_succeeded=${ARM64_SUCCEEDED}" >> "$GITHUB_OUTPUT"
          echo "arm64_failed=${ARM64_FAILED}" >> "$GITHUB_OUTPUT"
          echo "arm64_skipped=${ARM64_SKIPPED}" >> "$GITHUB_OUTPUT"
          echo "license_failed=${LICENSE_FAILED}" >> "$GITHUB_OUTPUT"

      - name: Notify on discover failure
        # Fires when the discover step itself fails, previously silent
        if: failure() && steps.discover.outcome == 'failure'
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          curl -sf -X POST "https://api.pushover.net/1/messages.json" \
            -d "token=${PUSHOVER_TOKEN}" \
            -d "user=${PUSHOVER_USER}" \
            -d "title=Mattermost patcher: discovery failed" \
            -d "message=Failed to discover new Mattermost releases. Check the Actions log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "priority=0"

      - name: Notify on patch failure
        if: steps.build.outputs.failed != '' || steps.build.outputs.arm64_failed != '' || steps.build.outputs.license_failed != ''
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          FAILED="${{ steps.build.outputs.failed }}"
          SUCCEEDED="${{ steps.build.outputs.succeeded }}"
          ARM64_FAILED="${{ steps.build.outputs.arm64_failed }}"
          ARM64_SUCCEEDED="${{ steps.build.outputs.arm64_succeeded }}"
          LICENSE_FAILED="${{ steps.build.outputs.license_failed }}"

          TITLE="Mattermost patcher: patch or license check failed"
          MESSAGE=""
          if [ -n "$FAILED" ]; then
            MESSAGE=$(printf "Failed to patch (amd64): %s" "$FAILED")
          fi
          if [ -n "$ARM64_FAILED" ]; then
            if [ -n "$MESSAGE" ]; then
              MESSAGE=$(printf "%s\nFailed to patch (arm64): %s" "$MESSAGE" "$ARM64_FAILED")
            else
              MESSAGE=$(printf "Failed to patch (arm64): %s" "$ARM64_FAILED")
            fi
          fi
          if [ -n "$SUCCEEDED" ]; then
            MESSAGE=$(printf "%s\n\nSuccessfully patched (amd64): %s" "$MESSAGE" "$SUCCEEDED")
          fi
          if [ -n "$ARM64_SUCCEEDED" ]; then
            MESSAGE=$(printf "%s\nSuccessfully patched (arm64): %s" "$MESSAGE" "$ARM64_SUCCEEDED")
          fi
          if [ -n "$LICENSE_FAILED" ]; then
            MESSAGE=$(printf "%s\n\nLicense verification failed for: %s" "$MESSAGE" "$LICENSE_FAILED")
          fi
          MESSAGE=$(printf "%s\n\nAction needed: update patch.sh for the failing version(s).\nRepo: %s" "$MESSAGE" "${{ github.repository }}")

          curl -sf -X POST "https://api.pushover.net/1/messages.json" \
            -d "token=${PUSHOVER_TOKEN}" \
            -d "user=${PUSHOVER_USER}" \
            -d "title=${TITLE}" \
            -d "message=${MESSAGE}" \
            -d "priority=-1"


  # Pull requests: verify every pattern group still patches AND accepts the
  # license. One representative version per group per architecture, run in
  # parallel on the matrix. (5.39 has no ARM64 build; 11.6.0 is ARM64-only
  # here because its x86 pattern group is covered by 11.7.0.)
  pr-license-matrix:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "5.39.3",  arch: "amd64" }
          - { version: "6.6.0",   arch: "amd64" }
          - { version: "7.10.0",  arch: "amd64" }
          - { version: "9.7.0",   arch: "amd64" }
          - { version: "11.7.0",  arch: "amd64" }
          - { version: "11.9.0",  arch: "amd64" }
          - { version: "11.10.0", arch: "amd64" }
          - { version: "6.6.0",   arch: "arm64" }
          - { version: "9.7.0",   arch: "arm64" }
          - { version: "11.6.0",  arch: "arm64" }
          - { version: "11.7.0",  arch: "arm64" }
          - { version: "11.9.0",  arch: "arm64" }
          - { version: "11.10.0", arch: "arm64" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      # Needed to execute the ARM64 binary (binfmt via qemu-user)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install patch tooling
        run: |
          if ! command -v xxd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq vim-common
          fi

      - name: Download and extract Mattermost ${{ matrix.version }} (${{ matrix.arch }})
        run: |
          set -euo pipefail
          rm -rf /tmp/mm-app && mkdir -p /tmp/mm-app
          curl -sfL -o /tmp/mm.tar.gz \
            "https://releases.mattermost.com/${{ matrix.version }}/mattermost-enterprise-${{ matrix.version }}-linux-${{ matrix.arch }}.tar.gz"
          tar -xzf /tmp/mm.tar.gz -C /tmp/mm-app

      - name: Patch the binary
        run: |
          set -euo pipefail
          bash patch.sh --quiet /tmp/mm-app/mattermost/bin/mattermost
          # second run must detect already-patched (exit 6)
          set +e
          bash patch.sh --quiet /tmp/mm-app/mattermost/bin/mattermost
          code=$?
          set -e
          [ "$code" = "6" ] || { echo "ERROR: expected exit 6 (already patched), got $code"; exit 1; }

      - name: Verify the license is accepted
        run: |
          bash .github/license-check.sh /tmp/mm-app/mattermost "${{ matrix.version }}-${{ matrix.arch }}" 18000

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.version }}-${{ matrix.arch }}
          path: /tmp/mm-app/mattermost/server.log
          if-no-files-found: ignore
